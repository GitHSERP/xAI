<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇勝 xAI 銷項辨識系統｜影片教學專區</title>
  <meta name="description" content="奇勝 xAI 銷項辨識系統影片教學專區，支援分類瀏覽、搜尋與本頁播放教學影片。">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero__brand">
        <img class="hero__logo" src="./logo.png" alt="奇勝公司 Logo">
        <div>
          <p class="hero__eyebrow">奇勝 xAI 銷項辨識系統</p>
          <h1>影片教學專區</h1>
        </div>
      </div>
      <p class="hero__description">
        以播放清單方式集中管理教學影片，依分類篩選後可直接在本頁觀看。
      </p>
    </header>

    <main class="main-content">
      <section class="workspace" aria-label="影片播放區">
        <div class="player-panel">
          <div class="player-panel__video">
            <video id="videoPlayer" controls preload="metadata" playsinline></video>
            <span id="videoFeedback" class="player-feedback" aria-hidden="true">
              <span class="player-feedback__icon player-feedback__icon--play"></span>
            </span>
          </div>
          <div class="player-panel__content">
            <div class="player-panel__meta">
              <span id="currentCategory" class="player-panel__tag">載入中</span>
              <span id="currentOrder" class="player-panel__order"></span>
            </div>
            <h2 id="currentTitle">準備載入影片</h2>
            <p id="currentDescription">請從右側播放清單選擇要播放的教學內容。</p>
          </div>
        </div>

        <aside class="playlist-panel" aria-label="播放清單">
          <div class="toolbar">
            <div class="search-panel">
              <label class="search-label" for="searchInput">搜尋影片</label>
              <div class="search-field">
                <input
                  id="searchInput"
                  type="search"
                  placeholder="搜尋標題、介紹或分類"
                  autocomplete="off"
                >
              </div>
            </div>
            <nav class="category-nav" aria-label="影片分類">
              <div id="categoryTabs" class="category-tabs"></div>
            </nav>
          </div>

          <div class="results-header" aria-live="polite">
            <div>
              <h2>播放清單</h2>
              <p id="resultSummary">載入中...</p>
            </div>
          </div>

          <div id="videoGrid" class="video-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>找不到符合條件的影片</h3>
            <p>請調整搜尋關鍵字或切換分類。</p>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
