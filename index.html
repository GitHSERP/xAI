<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇勝 xAI 銷項辨識系統｜影片教學專區</title>
  <meta name="description" content="奇勝 xAI 銷項辨識系統影片教學專區，分類瀏覽、搜尋與本頁播放教學影片。">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <h1 class="sr-only">奇勝 xAI 銷項辨識系統｜影片教學專區</h1>
      <div class="hero__banner-shell">
        <img class="hero__banner" src="./brand-header-optimized.png" alt="奇勝 xAI 辨識系統 影片教學專區">
      </div>
    </header>

    <main class="main-content">
      <section class="workspace" aria-label="影片播放區">
        <div class="player-panel">
          <div class="player-panel__video">
            <video id="videoPlayer" controls preload="metadata" playsinline></video>
            <span id="idleOverlay" class="player-idle-overlay" aria-hidden="true">
              <span class="player-idle-overlay__icon"></span>
            </span>
            <span id="videoFeedback" class="player-feedback" aria-hidden="true">
              <span class="player-feedback__icon player-feedback__icon--play"></span>
            </span>
          </div>
          <div class="player-panel__content">
            <div class="player-panel__meta">
              <div class="player-panel__meta-left">
                <span id="currentCategory" class="player-panel__tag">載入中</span>
                <span id="currentOrder" class="player-panel__order"></span>
              </div>
              <div class="player-panel__meta-right">
                <button id="copyVideoLink" class="player-panel__meta-button" type="button">複製影片網址</button>
                <span id="copyVideoLinkStatus" class="player-panel__status" aria-live="polite"></span>
              </div>
            </div>
            <h2 id="currentTitle">準備載入影片</h2>
            <p id="currentDescription">請從右側播放清單選擇要播放的教學內容。</p>
          </div>
        </div>

        <aside class="playlist-panel" aria-label="播放清單">
          <div class="toolbar">
            <div class="search-panel">
              <label class="search-label" for="searchInput">搜尋影片</label>
              <div class="search-field">
                <input
                  id="searchInput"
                  type="search"
                  placeholder="搜尋標題、介紹或分類"
                  autocomplete="off"
                >
              </div>
            </div>
            <nav class="category-nav" aria-label="影片分類">
              <div id="categoryTabs" class="category-tabs"></div>
            </nav>
          </div>

          <div class="results-header" aria-live="polite">
            <div>
              <h2>播放清單</h2>
              <p id="resultSummary">載入中...</p>
            </div>
          </div>

          <div id="videoGrid" class="video-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>找不到符合條件的影片</h3>
            <p>請調整搜尋關鍵字或切換分類。</p>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script>
    (function () {
      var dataScript = document.createElement("script");
      dataScript.src = "./data.js?v=" + Date.now();
      dataScript.defer = true;
      document.body.appendChild(dataScript);

      var appScript = document.createElement("script");
      appScript.src = "./app.js";
      appScript.defer = true;
      document.body.appendChild(appScript);
    })();
  </script>
</body>
</html>
